{% extends 'base.html' %}

{% block title %}Register — Vendor City{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto mt-10">
    <div class="bg-white rounded-lg shadow-md p-8">

        <div class="text-center mb-6">
            <p class="text-4xl mb-2">🛢️</p>
            <h1 class="text-2xl font-bold text-blue-900">Create an Account</h1>
            <p class="text-gray-500 text-sm mt-1">Join Vendor City — Oil & Gas Vendor Platform</p>
        </div>

        {% for message in messages %}
            <div class="mb-4 px-4 py-3 rounded text-sm
                {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200
                {% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
                {{ message }}
            </div>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-semibold mb-1">Username</label>
                <input type="text" name="username" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Choose a username">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-semibold mb-1">Email</label>
                <input type="email" name="email" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Your email address">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-semibold mb-1">Company Name</label>
                <input type="text" name="company_name"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Your company name">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-semibold mb-1">Phone Number</label>
                <input type="text" name="phone_number"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="e.g. 08012345678">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-semibold mb-1">Role</label>
                <select name="role" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">-- Select your role --</option>
                    <option value="vendor">Vendor</option>
                    <option value="vendor_officer">Vendor Officer</option>
                    <option value="compliance_officer">Compliance Officer</option>
                    <option value="senior_management">Senior Management</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-semibold mb-1">Password</label>
                <input type="password" name="password1" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Choose a password">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-semibold mb-1">Confirm Password</label>
                <input type="password" name="password2" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Repeat your password">
            </div>

            <button type="submit"
                class="w-full bg-blue-900 text-white py-2 rounded-lg font-semibold hover:bg-blue-800 transition">
                Create Account
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-4">
            Already have an account?
            <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Login here</a>
        </p>
    </div>
</div>

{% endblock %}

{% extends 'base.html' %}

{% block title %}Login — Vendor City{% endblock %}

{% block content %}

<div class="max-w-md mx-auto mt-10">
    <div class="bg-white rounded-lg shadow-md p-8">

        <div class="text-center mb-6">
            <p class="text-4xl mb-2">🛢️</p>
            <h1 class="text-2xl font-bold text-blue-900">Login to Vendor City</h1>
            <p class="text-gray-500 text-sm mt-1">Oil & Gas Vendor Management Platform</p>
        </div>

        {% for message in messages %}
            <div class="mb-4 px-4 py-3 rounded text-sm
                {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200
                {% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
                {{ message }}
            </div>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-semibold mb-1">Username</label>
                <input type="text" name="username" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter your username">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-semibold mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter your password">
            </div>
            <button type="submit"
                class="w-full bg-blue-900 text-white py-2 rounded-lg font-semibold hover:bg-blue-800 transition">
                Login
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-4">
            Don't have an account?
            <a href="{% url 'register' %}" class="text-blue-600 hover:underline">Register here</a>
        </p>
    </div>
</div>

{% endblock %}
